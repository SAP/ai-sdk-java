name: "End-to-end Tests"
on:
  workflow_dispatch:
    inputs:
      realtime_flakiness_runs:
        description: "Repeat RealtimeApiTest#testSpeechToSpeech N times (0 = skip)"
        required: false
        default: "100"

env:
  MVN_MULTI_THREADED_ARGS: --batch-mode --no-transfer-progress --fail-at-end --show-version --threads 1C
  JAVA_VERSION: 21

jobs:
  end-to-end-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Setup java"
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "sapmachine"
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: "Build SDK"
        run: mvn ${{ env.MVN_MULTI_THREADED_ARGS }} clean install -DskipTests -DskipFormatting

      - name: "Run RealtimeApiTest#testSpeechToSpeech (${{ inputs.realtime_flakiness_runs }}x)"
        env:
          AICORE_SERVICE_KEY: ${{ secrets.AI_CORE_CANARY }}
        run: |
          failures=0
          for i in $(seq 1 ${{ inputs.realtime_flakiness_runs }}); do
            echo "--- Run $i / ${{ inputs.realtime_flakiness_runs }} ---"
            if ! mvn --batch-mode --no-transfer-progress surefire:test \
                -pl :spring-app \
                -DskipTests=false \
                "-Dtest=com.sap.ai.sdk.app.controllers.RealtimeApiTest#testSpeechToSpeech" \
                "-Daicore.landscape=canary"; then
              failures=$((failures + 1))
              echo "Run $i FAILED"
            fi
          done
          echo "Failures: $failures / ${{ inputs.realtime_flakiness_runs }}"
          [ $failures -eq 0 ]
