name: 'Fosstars (Security)'
on:
  workflow_dispatch:
  schedule:
    - cron: '42 03 * * MON-FRI' # 03:42 on weekdays, a somewhat random time to avoid producing load spikes on the GH actions infrastructure

env:
  MVN_MULTI_THREADED_ARGS: --batch-mode --no-transfer-progress --fail-at-end --show-version --threads 1C
  JAVA_VERSION: 21
  CVE_DATA_DIR: ~/.m2/repository/org/owasp/dependency-check-data
  CVE_RELEASE_TAG: cve-db
  CVE_ASSET_NAME: dependency-check-data.tar.gz

jobs:
  create_fosstars_report:
    name: 'Security rating (${{ matrix.branch }})'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        branch: [ main, v2 ]
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: 'Setup java'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'sapmachine'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      # The persistent CVE DB is produced by the 'Update CVE Database' workflow
      # and stored as a release asset. The scan never contacts the NVD API itself.
      - name: 'Restore CVE Database from Release Asset'
        run: |
          mkdir -p "${CVE_DATA_DIR/#\~/$HOME}"
          for attempt in 1 2 3; do
            if gh release download "$CVE_RELEASE_TAG" --repo "${{ github.repository }}" --pattern "$CVE_ASSET_NAME" --dir .; then
              tar -xzf "$CVE_ASSET_NAME" -C "${CVE_DATA_DIR/#\~/$HOME}"
              rm -f "$CVE_ASSET_NAME"
              exit 0
            fi
            echo "Download attempt $attempt/3 failed."
            sleep $((attempt * 15))
          done
          echo "::error::Could not download CVE database asset '$CVE_ASSET_NAME' from release '$CVE_RELEASE_TAG'."
          echo "::error::Unlike a cache miss, this is a real failure - the 'Update CVE Database' workflow must run successfully first, and the release asset must not have been deleted."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Warn (do not fail) if the DB is stale, which signals the update workflow has not run recently.
      - name: 'Check CVE Database Freshness'
        run: |
          DB_FILE=$(find "${CVE_DATA_DIR/#\~/$HOME}" -name '*.mv.db' -print -quit)
          if [ -z "$DB_FILE" ]; then
            echo "::warning::No H2 database file found after restore."
            exit 0
          fi
          AGE_DAYS=$(( ( $(date +%s) - $(date -r "$DB_FILE" +%s) ) / 86400 ))
          echo "CVE database is $AGE_DAYS day(s) old."
          if [ "$AGE_DAYS" -gt 7 ]; then
            echo "::warning::CVE database is older than 7 days - the 'Update CVE Database' workflow may be failing."
          fi

      - name: 'Build SDK'
        run: |
          MVN_ARGS="${{ env.MVN_MULTI_THREADED_ARGS }} clean install -DskipTests -DskipFormatting"
          mvn $MVN_ARGS

      - name: 'Create settings.xml'
        run: |
          echo '${{ secrets.OSS_INDEX_SETTINGS_XML }}' > settings.xml

      - name: 'CVE Scan'
        run: >
          mvn -T1 --no-transfer-progress -s settings.xml
          --batch-mode org.owasp:dependency-check-maven:check org.owasp:dependency-check-maven:aggregate
          -Ddependency-check.autoupdate=false

      - name: 'Archive CVE Report'
        uses: actions/upload-artifact@v7
        with:
          name: cve-report
          path: target/dependency-check-report.html
          retention-days: 7

      # This action changes the active branch!
      - name: 'Fosstars Rating'
        uses: SAP/fosstars-rating-core-action@v1.14.0
        with:
          report-branch: ${{ matrix.branch == 'main' && 'fosstars-report' || format('fosstars-report-{0}', matrix.branch) }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Slack Notification'
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ OWASP Dependency check failed on `${{ matrix.branch }}`! 😬 Please inspect & fix by clicking <https://github.com/SAP/ai-sdk-java/actions/runs/${{ github.run_id }}|here>"
            }
