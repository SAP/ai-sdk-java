name: 'Dependabot Auto-Merge'

on:
  workflow_dispatch:
  schedule:
    - cron: '13 10 * * *' # trigger daily at 10:13

env:
  DEPENDABOT_GROUPS: |
    production-major group
    production-minor-patch group
    plugins group
    test group
    github-actions group
jobs:
  review-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read # all write operations use app token
    steps:
      - name: 'Create GitHub App Token'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}
          owner: SAP
          repositories: ai-sdk-java
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7

      - name: 'Approve and Merge PRs'
        run: |
          PRS=$(gh pr list --app "dependabot" --state "open" --json number,title,headRefOid)
          PR_NUMBERS=
          while IFS= read -r GROUP; do
            if [[ -z "$GROUP" ]]; then
              continue
            fi

            MATCHES=$(jq -r --arg group "$GROUP" '.[] | select(.title | contains($group)) | .number' <<< "$PRS")
            echo "[DEBUG] Found PRs for group '$GROUP': '$MATCHES'"

            PR_NUMBERS="$MATCHES"$'\n'"$PR_NUMBERS"
          done <<< "${{ env.DEPENDABOT_GROUPS }}"
          echo "[DEBUG] Approving and Merging following PRs: '$PR_NUMBERS'"

          FAILED_PRS=
          while IFS= read -r PR_NUMBER; do
            if [[ -z "$PR_NUMBER" ]]; then
              continue
            fi

            HEAD_SHA=$(jq -r --argjson number "$PR_NUMBER" '.[] | select(.number == $number) | .headRefOid' <<< "$PRS")
            COMMIT=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '{author: .author.login, verified: .commit.verification.verified}')
            LAST_AUTHOR=$(jq -r '.author' <<< "$COMMIT")
            VERIFIED=$(jq -r '.verified' <<< "$COMMIT")
            if [[ "$LAST_AUTHOR" != "dependabot[bot]" || "$VERIFIED" != "true" ]]; then
              echo "[DEBUG] Skipping PR #$PR_NUMBER: commit author='$LAST_AUTHOR' verified='$VERIFIED'"
              continue
            fi

            echo "[DEBUG] Approving and Merging PR #$PR_NUMBER at $HEAD_SHA"
            gh pr review "$PR_NUMBER" --approve
            MERGED=false
            for DELAY in 0 15 15 15 15 15; do
              sleep "$DELAY"
              if gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"; then
                MERGED=true
                break
              fi
            done
            if [[ "$MERGED" != "true" ]]; then
              echo "[DEBUG] All attempts to enable auto-merge for PR #$PR_NUMBER failed"
              FAILED_PRS="$FAILED_PRS #$PR_NUMBER"
            fi
          done <<< "$PR_NUMBERS"

          if [[ -n "$FAILED_PRS" ]]; then
            echo "Failed to enable auto-merge for:$FAILED_PRS"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
