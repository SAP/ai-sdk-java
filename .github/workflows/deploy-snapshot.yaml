name: Deploy Snapshot to common SAP Artifactory

on:
  workflow_dispatch:
#  schedule:
#    - cron: 0 20 * * 1-5 # Every weekday at 20:00 UTC (8 PM UTC)

jobs:
  deploy-snapshot:
    name: "Deploy Snapshot (${{ matrix.branch }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: [ main, v2 ]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: "Setup java"
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "sapmachine"
          java-version: "21"
          server-id: artifactory-snapshots
          server-username: DEPLOYMENT_USER
          server-password: DEPLOYMENT_PASS

      - name: "Publish Snapshot"
        run: >
          mvn 
          --batch-mode
          --no-transfer-progress
          --threads 1C
          --show-version
          -DrepositoryId=artifactory-snapshots
          -Dmaven.compiler.showCompilationChanges
          -Dhttp.keepAlive=false
          clean package deploy
        env:
          DEPLOYMENT_USER: ${{ secrets.ARTIFACTORY_COMMON_USER }}
          DEPLOYMENT_PASS: ${{ secrets.ARTIFACTORY_COMMON_PASSWORD }}

      - name: "Slack Notification"
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "⚠️ Snapshot Deployment failed for branch `${{ matrix.branch }}`! 😬 Please inspect & fix by clicking <https://github.com/SAP/ai-sdk-java/actions/runs/${{ github.run_id }}|here>"
            }
