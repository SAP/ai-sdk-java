components:
  schemas:
    ColumnarData:
      additionalProperties:
        items: {}
        type: array
      type: object
      title: ColumnarData
      description: "Columnar data format where each key is a column name\nand the\
        \ value is a list of values for that column.\n\nExample:\n{\n    \"code\"\
        : [\"new_code1\", \"new_code2\"],\n    \"category\": [\"Electronics\", \"\
        Clothing\"],\n    \"price\": [100, 50]\n}"
    ContextSelectionConfig:
      properties:
        indexColumn:
          title: Indexcolumn
          description: Name of the unique row-identifier column (e.g. 'ROW_INDEX').
            Required for 'heuristic', and deterministic 'random' strategies.
          type: string
          nullable: true
        numRows:
          title: Numrows
          description: Number of rows to select for context. If not provided or set
            to 0, context selection is skipped.
          type: integer
          minimum: 0.0
          nullable: true
        strategy:
          $ref: '#/components/schemas/ContextSelectionStrategyEnum'
          description: Sampling strategy for context selection.
          default: random
        strategyConfig:
          oneOf:
            - $ref: '#/components/schemas/SamplingNoneConfig'
            - $ref: '#/components/schemas/SamplingRandomConfig'
            - $ref: '#/components/schemas/SamplingHeuristicConfig'
          title: Strategyconfig
          description: Strategy-specific configuration parameters.
        filterConditions:
          anyOf:
            - $ref: '#/components/schemas/FilterConditions'
            - $ref: '#/components/schemas/FilterCondition'
          title: Filterconditions
          description: Filter conditions for context selection
          nullable: true
      type: object
      required:
        - strategyConfig
      title: ContextSelectionConfig
      description: Configuration for context selection.
    ContextSelectionStrategyEnum:
      type: string
      enum:
        - none
        - random
        - heuristic
        - auto
      title: ContextSelectionStrategyEnum
      description: Context selection strategies for data sampling.
    FilterCondition:
      properties:
        field:
          type: string
          title: Field
          description: Field name to filter on
        op:
          type: string
          title: Op
          description: Filter operator (e.g., 'eq', 'gte', 'lte')
        value:
          title: Value
          description: Value to compare against
      type: object
      required:
        - field
        - op
        - value
      title: FilterCondition
      description: A single filter condition for context selection.
    FilterConditions:
      properties:
        logic:
          type: string
          title: Logic
          description: Logical operator to combine conditions ('and' or 'or')
        conditions:
          items:
            anyOf:
              - $ref: '#/components/schemas/FilterCondition'
              - $ref: '#/components/schemas/FilterConditions'
          type: array
          title: Conditions
          description: List of filter conditions
      type: object
      required:
        - logic
        - conditions
      title: FilterConditions
      description: Filter conditions for context selection.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ModelConfig:
      properties: {}
      additionalProperties: true
      type: object
      title: ModelConfig
    ModelRpt1:
      properties:
        index_column:
          title: Index Column
          description: (Optional) The name of the column used to identify the row.
            This column isn't used as an input feature for the model, and is returned
            in the response objects.
          type: string
          nullable: true
        data_schema:
          title: Data Schema
          description: '(Optional) A schema definition for data types of all columns.
            Possible values: string, numeric, or date.'
          example:
            data_schema:
              ORDERDATE:
                dtype: date
              PRICE:
                dtype: numeric
              PRODUCT:
                dtype: string
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
          nullable: true
        parse_data_types:
          type: boolean
          title: Parse Data Types
          description: '(Optional, RPT default: True) Relevant when data_schema isn''t
            passed. Whether or not to parse data types, such as interpreting strings
            as numbers or dates.'
          default: true
      additionalProperties: true
      type: object
      title: ModelRpt1
      description: 'RPT1 Reference: https://help.sap.com/docs/sap-ai-core/generative-ai/example-payloads-for-inferencing-sap-rpt-1?locale=en-US#parameters'
    ModelRpt1_5:
      properties:
        index_column:
          title: Index Column
          description: (Optional) The name of the column used to identify the row.
            This column isn't used as an input feature for the model, and is returned
            in the response objects.
          type: string
          nullable: true
        data_schema:
          title: Data Schema
          description: '(Optional) A schema definition for data types of all columns.
            Possible values: string, numeric, or date.'
          example:
            data_schema:
              ORDERDATE:
                dtype: date
              PRICE:
                dtype: numeric
              PRODUCT:
                dtype: string
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
          nullable: true
        parse_data_types:
          type: boolean
          title: Parse Data Types
          description: '(Optional, RPT Default: True) Relevant when data_schema isn''t
            passed. Whether or not to parse data types, such as interpreting strings
            as numbers or dates.'
          default: true
        prediction_config:
          $ref: '#/components/schemas/ModelRpt1_5PredictionConfig'
          description: (Optional) An object for configuring predictions.
      additionalProperties: true
      type: object
      title: ModelRpt1_5
    ModelRpt1_5Explanations:
      properties:
        top_column_scores:
          type: integer
          maximum: 20.0
          minimum: 0.0
          title: Top Column Scores
          description: '(Optional, RPT Default: 0) Number of top column scores to
            return. A value of 0 disables explainability.'
          default: 0
        top_relevant_context_rows:
          title: Top Relevant Context Rows
          description: (Optional) Number of most relevant context rows to return for
            each query row.
          type: integer
          maximum: 20.0
          nullable: true
      additionalProperties: true
      type: object
      title: ModelRpt1_5Explanations
    ModelRpt1_5PredictionConfig:
      properties:
        explanations:
          $ref: '#/components/schemas/ModelRpt1_5Explanations'
          description: (Optional) Configuration used to request explanations.
      additionalProperties: true
      type: object
      title: ModelRpt1_5PredictionConfig
    ModelRpt1_6:
      properties:
        index_column:
          title: Index Column
          description: (Optional) The name of the column used to identify the row.
            This column isn't used as an input feature for the model, and is returned
            in the response objects.
          type: string
          nullable: true
        data_schema:
          title: Data Schema
          description: '(Optional) A schema definition for data types of all columns.
            Possible values: string, numeric, or date.'
          example:
            data_schema:
              ORDERDATE:
                dtype: date
              PRICE:
                dtype: numeric
              PRODUCT:
                dtype: string
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
          nullable: true
        parse_data_types:
          type: boolean
          title: Parse Data Types
          description: '(Optional, RPT Default: True) Relevant when data_schema isn''t
            passed. Whether or not to parse data types, such as interpreting strings
            as numbers or dates.'
          default: true
        prediction_config:
          $ref: '#/components/schemas/ModelRpt1_6PredictionConfig'
          description: (Optional) An object for configuring predictions.
      additionalProperties: true
      type: object
      title: ModelRpt1_6
    ModelRpt1_6PredictionConfig:
      properties:
        explanations:
          $ref: '#/components/schemas/ModelRpt1_5Explanations'
          description: (Optional) Configuration used to request explanations.
        context_mode:
          type: string
          title: Context Mode
          description: (Optional, default 'default') Only available for sap-rpt-1.6-large.
            Set to 'deep' for higher accuracy at higher latency when you have more
            than 8000 context rows. The value is passed through to the model, which
            validates the supported values.
          default: default
      additionalProperties: true
      type: object
      title: ModelRpt1_6PredictionConfig
    ModelTabPfn:
      properties:
        task_config:
          $ref: '#/components/schemas/TabpfnTaskConfig'
          description: (Optional) TabPFN task configuration.
        index_column:
          type: string
          description: Optional query/context column to exclude from model features.
            The column must exist. It is consumed by the orchestrator and is not sent
            to TabPFN.
      additionalProperties: true
      type: object
      title: ModelTabPfn
      description: 'Model-specific options for tabpfn-3.5-plus. Configure task_config.tabpfn_config
        and task_config.predict_params.

        The orchestrator derives the task and training/test arrays from predictionConfig
        and rows/columns. index_column

        is an optional top-level modelConfig field consumed by the orchestrator and
        excluded from TabPFN features and

        payloads. Unsupported RPT options are rejected.'
    PredictRequest:
      properties:
        modelName:
          $ref: '#/components/schemas/TFMEnum'
          description: Name of the deployed model
        scenarioConfigName:
          title: Scenarioconfigname
          description: Scenario configuration identifier. Required to retrieve TabularArtifact,
            required to perform Context Selection.
          type: string
          nullable: true
        contextSelectionConfig:
          description: Context selection configuration
          $ref: '#/components/schemas/ContextSelectionConfig'
          nullable: true
        predictionConfig:
          $ref: '#/components/schemas/PredictionConfig'
          description: Prediction configuration
        responseFormat:
          $ref: '#/components/schemas/ResponseFormatEnum'
          description: 'Response representation: native (default) preserves the selected
            model response; harmonized uses the common schema. The spelling harmonised
            is accepted as an alias. TabPFN output_type must be compatible with the
            selected task and response format; see the operation description.'
          default: native
        modelConfig:
          oneOf:
            - $ref: '#/components/schemas/ModelConfig'
            - $ref: '#/components/schemas/ModelRpt1'
            - $ref: '#/components/schemas/ModelRpt1_5'
            - $ref: '#/components/schemas/ModelRpt1_6'
            - $ref: '#/components/schemas/ModelTabPfn'
          title: Modelconfig
          description: Optional model-specific configuration. For tabpfn-3.5-plus,
            use task_config.tabpfn_config and task_config.predict_params. Omitted
            modelConfig is treated as an empty object. RPT-specific options are not
            supported by TabPFN.
        columns:
          description: Query-only rows in columnar form. An object mapping from column
            name to array of column values.
          $ref: '#/components/schemas/ColumnarData'
          nullable: true
        contextColumns:
          description: (Optional) Context rows in columnar form, only relevant if
            'columns' is provided. An object mapping from column name to array of
            column values.
          $ref: '#/components/schemas/ColumnarData'
          nullable: true
        rows:
          description: Query-only rows in row form. An array of objects representing
            table rows.
          $ref: '#/components/schemas/RowData'
          nullable: true
        contextRows:
          description: (Optional) Context rows in row form, only relevant if 'rows'
            is provided. An array of objects representing table rows.
          $ref: '#/components/schemas/RowData'
          nullable: true
      type: object
      required:
        - modelName
        - predictionConfig
      title: PredictRequest
      description: 'Make predictions with a supported Tabular Foundation Model using
        rows or columns.


        **TabPFN**


        Select modelName: tabpfn-3.5-plus. TabPFN supports exactly one target column
        per request. Set the target

        task_type to classification or regression; the default is classification.
        Supply labelled training rows through

        contextRows/contextColumns, labelled query rows, or context selection. At
        least one labelled training row and

        one query row containing the prediction placeholder are required. Regression
        training targets must be numeric.

        Classification training targets must not be null or empty; entirely numeric
        targets are rejected by this

        orchestrator''s classification preprocessing.


        **Response format**


        responseFormat defaults to native, which returns the model-native response.
        Select harmonized

        for the common response schema. The legacy spelling harmonised is also accepted
        and normalized to harmonized.

        For TabPFN, native responses contain metadata, prediction, usage, and optionally
        model_id. Harmonized responses

        contain id, modelName, metadata, predictions, and explanations. TabPFN currently
        returns null for id and

        explanations in harmonized responses.


        **Output types**


        Set modelConfig.task_config.predict_params.output_type. Native classification
        supports probas,

        preds, and top_k. Harmonized classification supports top_k only. Native regression
        supports mean, median, mode,

        quantiles, full, and main. Harmonized regression supports main, mean, median,
        and mode. When neither the request

        nor deployment defaults supply output_type, native classification defaults
        to probas and native regression to

        mean; harmonized classification defaults to top_k and harmonized regression
        to main. Omit output_type to use

        these defaults. For harmonized regression, main uses the model''s mean and
        the first and last quantile arrays as

        confidenceInterval (10th and 90th percentiles with the model''s default quantiles).
        mean, median, and mode return

        the selected statistic without confidenceInterval. They do not trigger a second
        inference request for intervals.


        **Configuration**


        TabPFN configuration is passed under modelConfig.task_config.tabpfn_config
        and

        modelConfig.task_config.predict_params. Do not send RPT-only options such
        as data_schema, parse_data_types, or

        context_mode. balance_probabilities is classification-only. Set predictionConfig.targetColumns[].top_k
        for

        classification; an explicit modelConfig.task_config.predict_params.top_k takes
        precedence. When neither is set,

        top_k defaults to 1. modelConfig.index_column identifies a column to exclude
        from model features; it is not

        forwarded to TabPFN.


        **Data format**


        Use either rows with contextRows, or columns with contextColumns. Query and
        supplied context data

        must have the same column names. Target-column keys task_type, prediction_placeholder,
        and top_k also accept the

        camelCase aliases taskType, predictionPlaceholder, and topK. Use contextSelectionConfig.strategy:
        none when all

        training context is supplied in the request.


        Required header: ai-resource-group. Authenticate with OAuth2 through the SAP
        AI Core deployment endpoint. The

        request and response examples use synthetic data and illustrative predictions;
        they are not accuracy guarantees.'
      example:
        columns:
          baseUnitOfMeasure:
            - EA
          baseUnitOfMeasureCode:
            - EA
          catalogId:
            - default-source-catalog
          catalogVersion:
            - Draft
          code:
            - BK-211-M
          currency:
            - USD
          division:
            - '[PREDICT]'
          gtin:
            - ''
          keywords:
            - cycling,gloves,hands,grip,protection,comfort
          manufacturerAID:
            - ACC-CSPW
          manufacturerName:
            - Ritchey
          minQuantity:
            - 1
          name:
            - BK Cycling Gloves - Size Medium
          price:
            - 21.1
          priceEndDate:
            - 31-12-2099
          priceStartDate:
            - 08-08-2025
          summary:
            - Treat your hands to a comfortable pair of cycling gloves. Size medium.
          superCategories:
            - all-products:Draft:sample-b2c-usSalesCatalog,gear:Draft:sample-b2c-usSalesCatalog,weight-dimensions:Draft:sample-b2c-usSalesCatalog,all-products:Draft:sample-b2c-usSalesCatalog,gear:Draft:sample-b2c-usSalesCatalog,weight-dimensions:Draft:sample-b2c-usSalesCatalog,all-products:Draft:sample-b2c-usSalesCatalog,gear:Draft:sample-b2c-usSalesCatalog,weight-dimensions:Draft:sample-b2c-usSalesCatalog
          userPriceGroup:
            - ''
        contextSelectionConfig:
          strategy: random
        modelConfig:
          __notes__: This is a sample sap-rpt-1.5 modelConfig
          data_schema:
            __notes__: 'Available dtyes are: string, numeric, or date.'
            baseUnitOfMeasure:
              dtype: string
            baseUnitOfMeasureCode:
              dtype: string
            catalogId:
              dtype: string
            catalogVersion:
              dtype: string
            code:
              dtype: string
            currency:
              dtype: string
            division:
              dtype: string
            gtin:
              dtype: string
            keywords:
              dtype: string
            manufacturerAID:
              dtype: string
            manufacturerName:
              dtype: string
            minQuantity:
              dtype: numeric
            name:
              dtype: string
            price:
              dtype: numeric
            priceEndDate:
              dtype: date
            priceStartDate:
              dtype: date
            summary:
              dtype: string
            superCategories:
              dtype: string
            userPriceGroup:
              dtype: string
          index_column: code
          prediction_config:
            explanations:
              top_column_scores: 3
              top_relevant_context_rows: 2
        modelName: sap-rpt-1.5
        predictionConfig:
          targetColumns:
            - name: division
              predictionPlaceholder: '[PREDICT]'
              taskType: classification
        scenarioConfigName: sample_scenario_config
    PredictResponse:
      properties:
        id:
          title: Id
          description: Response identifier. TabPFN currently returns null in harmonized
            responses; RPT preserves the identifier supplied by the model.
          type: string
          nullable: true
        modelName:
          $ref: '#/components/schemas/TFMEnum'
        metadata:
          $ref: '#/components/schemas/PredictResponseMetadata'
        predictions:
          items:
            additionalProperties:
              anyOf:
                - items:
                    anyOf:
                      - $ref: '#/components/schemas/PredictResponseClassification'
                      - $ref: '#/components/schemas/PredictResponseRegression'
                  type: array
                - {}
            type: object
          type: array
          title: Predictions
        explanations:
          title: Explanations
          description: Model explanations when available. TabPFN harmonized responses
            return null.
      additionalProperties: false
      type: object
      required:
        - id
        - modelName
        - metadata
        - predictions
        - explanations
      title: PredictResponse
      description: 'Common response returned when responseFormat is harmonized. Metadata
        uses camelCase. Native RPT and TabPFN

        responses have separate schemas. The harmonized response does not include
        status or additional_information.'
    PredictResponseClassification:
      properties:
        prediction:
          title: Prediction
        confidence:
          type: number
          title: Confidence
      additionalProperties: false
      type: object
      required:
        - prediction
        - confidence
      title: PredictResponseClassification
      description: 'One classification candidate with its probability. TabPFN top_k
        class indices are mapped back to class labels;

        one query row may have multiple candidates.'
    PredictResponseMetadata:
      properties:
        numColumns:
          title: Numcolumns
          type: integer
          nullable: true
        numTargetColumns:
          title: Numtargetcolumns
          type: integer
          nullable: true
        numRows:
          title: Numrows
          type: integer
          nullable: true
        numQueryRows:
          title: Numqueryrows
          type: integer
          nullable: true
        numPredictions:
          title: Numpredictions
          type: integer
          nullable: true
      additionalProperties: false
      type: object
      required:
        - numColumns
        - numTargetColumns
        - numRows
        - numQueryRows
        - numPredictions
      title: PredictResponseMetadata
      description: 'Harmonized metadata uses camelCase. For TabPFN, counts are derived
        from native usage; numRows includes training

        and predicted rows, and numColumns includes feature and target columns.'
    PredictResponseRegression:
      properties:
        prediction:
          title: Prediction
        confidenceInterval:
          title: Confidenceinterval
          description: Optional interval from model quantiles. For TabPFN main, this
            contains the first and last returned quantiles (10th and 90th percentiles
            with default quantiles). Omitted for TabPFN mean, median, and mode.
          items:
            type: number
          type: array
          nullable: true
      additionalProperties: false
      type: object
      required:
        - prediction
      title: PredictResponseRegression
      description: 'One regression prediction per target and query row. confidenceInterval
        is included only when the model output

        supplies an interval.'
    PredictionConfig:
      properties:
        targetColumns:
          items:
            $ref: '#/components/schemas/TargetColumn'
          type: array
          minItems: 1
          title: Targetcolumns
          description: Target columns to predict. TabPFN supports exactly one target
            column; this restriction is model-specific and does not limit RPT requests.
      additionalProperties: false
      type: object
      required:
        - targetColumns
      title: PredictionConfig
      description: 'Configuration for what to predict.


        Model-agnostic prediction config. Only contains fields shared across all TFMs.
        Model-specific fields belong in

        `PredictRequest.modelConfig`.'
    PredictionTask:
      type: string
      enum:
        - classification
        - regression
    RPT1Metadata:
      properties:
        num_columns:
          type: integer
          title: Num Columns
        num_rows:
          type: integer
          title: Num Rows
        num_predictions:
          type: integer
          title: Num Predictions
        num_query_rows:
          type: integer
          title: Num Query Rows
      additionalProperties: true
      type: object
      required:
        - num_columns
        - num_rows
        - num_predictions
        - num_query_rows
      title: RPT1Metadata
      description: Metadata about the prediction.
    RPT1P5Explanations:
      properties:
        top_column_scores:
          items:
            additionalProperties:
              type: number
            type: object
          type: array
          title: Top Column Scores
        top_relevant_context_rows:
          items:
            items: {}
            type: array
          type: array
          title: Top Relevant Context Rows
      additionalProperties: true
      type: object
      required:
        - top_column_scores
        - top_relevant_context_rows
      title: RPT1P5Explanations
    RPT1P5Response:
      properties:
        id:
          type: string
          title: Id
        metadata:
          $ref: '#/components/schemas/RPT1Metadata'
        predictions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Predictions
        status:
          $ref: '#/components/schemas/RPT1Status'
        explanations:
          $ref: '#/components/schemas/RPT1P5Explanations'
          nullable: true
      additionalProperties: true
      type: object
      required:
        - id
        - metadata
        - predictions
        - status
        - explanations
      title: RPT1P5Response
      description: 'Reference:

        Sample response is available at RPT1P5Response.get_sample()'
    RPT1P6Response:
      properties:
        id:
          type: string
          title: Id
        metadata:
          $ref: '#/components/schemas/RPT1Metadata'
        predictions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Predictions
        status:
          $ref: '#/components/schemas/RPT1Status'
        explanations:
          $ref: '#/components/schemas/RPT1P5Explanations'
          nullable: true
      additionalProperties: true
      type: object
      required:
        - id
        - metadata
        - predictions
        - status
        - explanations
      title: RPT1P6Response
      description: RPT1.6 has the same output schema as RPT1.5
    RPT1Response:
      properties:
        id:
          type: string
          title: Id
        metadata:
          $ref: '#/components/schemas/RPT1Metadata'
        predictions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Predictions
        status:
          $ref: '#/components/schemas/RPT1Status'
      additionalProperties: true
      type: object
      required:
        - id
        - metadata
        - predictions
        - status
      title: RPT1Response
      description: 'Reference: https://help.sap.com/docs/sap-ai-core/generative-ai/example-payloads-for-inferencing-sap-rpt-1?locale=en-US#status-codes-and-messages

        Sample response is available at RPT1Response.get_sample()'
    RPT1Status:
      properties:
        code:
          type: integer
          title: Code
        message:
          type: string
          title: Message
      additionalProperties: true
      type: object
      required:
        - code
        - message
      title: RPT1Status
      description: Status of the prediction.
    ResponseFormatEnum:
      type: string
      enum:
        - native
        - harmonized
      title: ResponseFormatEnum
      description: Response formats for predictions.
    RowData:
      items:
        additionalProperties: true
        type: object
      type: array
      title: RowData
      description: "Row-wise data format where each element is a dictionary\nrepresenting\
        \ a single row with column names as keys.\n\nExample:\n[\n    {\"code\": \"\
        new_code1\", \"category\": \"Electronics\", \"price\": 100},\n    {\"code\"\
        : \"new_code2\", \"category\": \"Clothing\", \"price\": 50},\n]"
    SamplingHeuristicConfig:
      properties:
        methodRatio:
          type: number
          title: Methodratio
          description: Fraction of numRows filled by scoring method (remainder is
            random fill). Must be between 0 and 1.
          default: 0.67
        fuzzyNumPct:
          type: number
          title: Fuzzynumpct
          description: Numeric fuzzy threshold as a fraction of the absolute query
            value. E.g. 0.1 = ±10%.
          default: 0.1
        poolSize:
          title: Poolsize
          description: If set, scoring runs against a random subsample of this many
            rows instead of the full table. None = full table scan.
          type: integer
          nullable: true
        fuzzyDateDays:
          type: integer
          title: Fuzzydatedays
          description: Day window for fuzzy date matching. A date column scores 1
            if abs(DAYS_BETWEEN(row_date, query_date)) <= dateFuzzyDays. Set to 0
            for exact date match.
          default: 30
        allowTimeoutFallback:
          type: boolean
          title: Allowtimeoutfallback
          description: When true, heuristic sampling falls back to random on timeout
            instead of raising an error. Set by the orchestrator when strategy=AUTO.
          default: false
      additionalProperties: true
      type: object
      title: SamplingHeuristicConfig
    SamplingNoneConfig:
      properties: {}
      additionalProperties: true
      type: object
      title: SamplingNoneConfig
      description: 'Strategy config for the ''none'' strategy.


        The ''none'' strategy performs no context selection, so it carries no

        tunable parameters. It exists to keep strategyConfig typed consistently

        across all strategies. All passthroughs still allow extra variables with

        `model_config = ConfigDict(extra="allow")`.'
    SamplingRandomConfig:
      properties:
        deterministic:
          type: boolean
          title: Deterministic
          description: When true, uses HASH_SHA256 of indexColumn for ordering instead
            of RAND(), producing the same row order on every call for the same data.
          default: false
      additionalProperties: true
      type: object
      title: SamplingRandomConfig
    Scalar:
      anyOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
      nullable: true
    TFMEnum:
      type: string
      enum:
        - sap-rpt-1-small
        - sap-rpt-1-large
        - sap-rpt-1.5
        - sap-rpt-1.5-large
        - sap-rpt-1.6
        - sap-rpt-1.6-large
        - tabpfn-3.5-plus
      title: TFMEnum
      description: Supported Tabular Foundation Models.
    TabPFN3p5plusResponse:
      properties:
        metadata:
          $ref: '#/components/schemas/TabPFNResponseMetadata'
        model_id:
          title: Model Id
          type: string
          nullable: true
        prediction:
          anyOf:
            - $ref: '#/components/schemas/TabPFNHarmonisedClassificationPrediction'
            - $ref: '#/components/schemas/TabPFNHarmonisedRegressionPrediction'
            - $ref: '#/components/schemas/TabPFNNonHarmonisedPrediction'
          title: Prediction
          description: 'For native regression mean, median, or mode: a numeric array
            with one value per predicted row. main: an object containing mean, median,
            mode, and quantiles. For classification top_k: classes, values (class
            indices), and probabilities. probas: class-probability arrays; preds:
            class-label arrays. quantiles and full preserve the model-native distribution
            output.'
        usage:
          $ref: '#/components/schemas/TabPFNResponseUsage'
      additionalProperties: true
      type: object
      required:
        - metadata
        - prediction
        - usage
      title: TabPFN3p5plusResponse
      description: 'Native TabPFN response, returned when responseFormat is native.
        prediction depends on

        task_config.predict_params.output_type; the native structure and extra model
        fields are preserved.'
    TabPFNHarmonisedClassificationPrediction:
      properties:
        classes:
          items:
            $ref: '#/components/schemas/Scalar'
          type: array
          title: Classes
        probabilities:
          items:
            items:
              type: number
            type: array
          type: array
          title: Probabilities
        values:
          items:
            items:
              type: integer
            type: array
          type: array
          title: Values
      additionalProperties: true
      type: object
      required:
        - classes
        - probabilities
        - values
      title: TabPFNHarmonisedClassificationPrediction
      description: 'The native top_k classification payload, despite the internal
        schema name. values contains indices into classes;

        probabilities contains the probability for each returned candidate.'
    TabPFNHarmonisedRegressionPrediction:
      properties:
        mean:
          items:
            type: number
          type: array
          title: Mean
        median:
          items:
            type: number
          type: array
          title: Median
        mode:
          items:
            type: number
          type: array
          title: Mode
        quantiles:
          items:
            items:
              type: number
            type: array
          type: array
          title: Quantiles
      additionalProperties: true
      type: object
      required:
        - mean
        - median
        - mode
        - quantiles
      title: TabPFNHarmonisedRegressionPrediction
      description: 'The native main regression payload, despite the internal schema
        name. Quantiles are arranged by quantile level

        and then by query row. Harmonized processing uses mean and the first and last
        quantile arrays.'
    TabPFNNonHarmonisedPrediction: {}
    TabPFNResponseMetadata:
      properties:
        task:
          $ref: '#/components/schemas/PredictionTask'
        test_set_num_cols:
          type: integer
          title: Test Set Num Cols
        test_set_num_rows:
          type: integer
          title: Test Set Num Rows
        n_estimators:
          type: integer
          title: N Estimators
        tabpfn_config:
          additionalProperties: true
          type: object
          title: Tabpfn Config
        classes:
          title: Classes
          items:
            $ref: '#/components/schemas/Scalar'
          type: array
          nullable: true
        top_k:
          title: Top K
          type: integer
          nullable: true
      additionalProperties: true
      type: object
      required:
        - task
        - test_set_num_cols
        - test_set_num_rows
        - n_estimators
        - tabpfn_config
      title: TabPFNResponseMetadata
    TabPFNResponseUsage:
      properties:
        X_test:
          $ref: '#/components/schemas/TabPFNUsageDimensions'
        X_train:
          $ref: '#/components/schemas/TabPFNUsageDimensions'
        y_train:
          $ref: '#/components/schemas/TabPFNUsageDimensions'
        n_estimators:
          type: integer
          title: N Estimators
        num_cells:
          type: integer
          title: Num Cells
        num_predictions:
          type: integer
          title: Num Predictions
      additionalProperties: true
      type: object
      required:
        - X_test
        - X_train
        - y_train
        - n_estimators
        - num_cells
        - num_predictions
      title: TabPFNResponseUsage
    TabPFNUsageDimensions:
      properties:
        num_cells:
          type: integer
          title: Num Cells
        num_cols:
          type: integer
          title: Num Cols
        num_rows:
          type: integer
          title: Num Rows
      additionalProperties: true
      type: object
      required:
        - num_cells
        - num_cols
        - num_rows
      title: TabPFNUsageDimensions
    TabpfnConfig:
      properties:
        n_estimators:
          type: integer
          title: N Estimators
          description: '(Optional, TabPFN default: 8) Number of estimators in the
            ensemble.'
          default: 8
        fit_mode:
          type: string
          title: Fit Mode
          description: '(Optional, TabPFN default: ''fit_preprocessors'') How the
            model is fitted before inference.'
          default: fit_preprocessors
        inference_precision:
          type: string
          title: Inference Precision
          description: '(Optional, TabPFN default: ''auto'') Numerical precision used
            during inference.'
          default: auto
        softmax_temperature:
          type: number
          title: Softmax Temperature
          description: '(Optional, TabPFN default: 0.9) Temperature applied to the
            softmax over class logits.'
          default: 0.9
        average_before_softmax:
          type: boolean
          title: Average Before Softmax
          description: '(Optional, TabPFN default: False) Whether to average ensemble
            logits before applying softmax.'
          default: false
        balance_probabilities:
          type: boolean
          title: Balance Probabilities
          description: '(Optional, TabPFN default: False) Whether to rebalance predicted
            class probabilities.'
          default: false
      additionalProperties: true
      type: object
      title: TabpfnConfig
      description: 'TabPFN model hyperparameters. Only explicitly supplied fields
        are forwarded; unset fields are resolved by

        deployment or model defaults. balance_probabilities must not be supplied for
        regression, even when false.'
    TabpfnPredictParams:
      properties:
        output_type:
          title: Output Type
          description: 'Native classification: probas, preds, top_k. Harmonized classification:
            top_k. Native regression: mean, median, mode, quantiles, full, main. Harmonized
            regression: main, mean, median, mode. When no request or deployment value
            is supplied, defaults are probas/mean for native classification/regression
            and top_k/main for harmonized classification/regression. main supplies
            mean plus available quantiles; mean, median and mode supply prediction
            values only. Omit the field to use defaults.'
          type: string
          nullable: true
        top_k:
          type: integer
          description: Optional model-specific number of classification candidates
            when output_type is top_k. Takes precedence over predictionConfig.targetColumns[].top_k.
      additionalProperties: true
      type: object
      title: TabpfnPredictParams
      description: 'Parameters controlling the TabPFN prediction output. Compatibility
        with task_type and responseFormat is

        validated at the API boundary. Extra model-specific options are passed through
        subject to capability validation.'
    TabpfnTaskConfig:
      properties:
        tabpfn_config:
          $ref: '#/components/schemas/TabpfnConfig'
          description: (Optional) TabPFN model hyperparameters.
        predict_params:
          $ref: '#/components/schemas/TabpfnPredictParams'
          description: (Optional) Parameters controlling the predict call.
      additionalProperties: true
      type: object
      title: TabpfnTaskConfig
    TargetColumn:
      properties:
        name:
          type: string
          title: Name
          description: Name of the column to predict
        prediction_placeholder:
          type: string
          title: Prediction Placeholder
          description: (Optional) Placeholder value indicating cells to predict. Also
            accepts predictionPlaceholder. For TabPFN, query rows with this target
            value are predicted; other query rows are used as training rows.
          default: '[PREDICT]'
        task_type:
          $ref: '#/components/schemas/TaskTypeEnum'
          description: (Optional) Type of prediction task (classification or regression).
            Also accepts taskType. For TabPFN regression, training labels must be
            numeric; entirely numeric classification targets are rejected.
          default: classification
        top_k:
          title: Top K
          description: (Optional) Controls how many labels to predict for each column
            in each row. Only applicable to 'classification' task type. Also accepts
            topK. TabPFN applies it when output_type is top_k; predict_params.top_k
            takes precedence and the fallback is 1.
          type: integer
          nullable: true
      type: object
      required:
        - name
      title: TargetColumn
      description: Configuration for a target column to predict.
    TaskTypeEnum:
      type: string
      enum:
        - classification
        - regression
      title: TaskTypeEnum
      description: ML task types for predictions.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
  securitySchemes:
    Oauth2:
      type: oauth2
      description: OAuth client credentials (client ID and secret) are required. These
        can be requested from SAP BTP cloud cockpit.
      flows:
        clientCredentials:
          tokenUrl: https://(subdomain_identity_zone).authentication.(host)/oauth/token
          scopes: {}
x-sap-shortText: A runtime orchestration layer that performs predictions with Tabular
  Foundation Models using structured data with no dataset-specific training required.
externalDocs:
  description: Documentation for SAP AI Core - Tabular AI Orchestration
  url: https://help.sap.com/docs/sap-ai-core/generative-ai-hub/tabular-ai
servers:
  - url: https://api.ai.{region}.ml.hana.ondemand.com/v2/inference/deployments/{deployment_id}
    description: Production endpoint for SAP AI Core
    variables:
      region:
        enum:
          - prod.eu-central-1.aws
          - prod.us-east-1.aws
          - prod.ap-northeast-1.aws
          - prod.ap-southeast-2.aws
          - prod-ap11.ap-southeast-1.aws
          - prod-br10.sa-east-1.aws
          - prod-eu20.westeurope.azure
          - prod-us21.eastus.azure
          - prod-us20.westus2.azure
          - prod-ap20.australiaeast.azure
          - prod-ap21.southeastasia.azure
          - prod-eu30.europe-west3.gcp
          - prod-us30.us-central1.gcp
          - prod-ap30.australia-southeast1.gcp
          - prod-in30.asia-south1.gcp
          - prod-eu01.eu-de-1.sapcc
        default: prod.eu-central-1.aws
      deployment_id:
        description: The deployment ID of the Tabular AI Orchestration service. To be
          obtained from the SAP AI Core service using the deployments endpoint.
        default: d1234567890
