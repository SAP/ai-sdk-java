openapi: 3.0.3
info:
  title: Tabular AI Orchestration
  version: 1.11.2
  description: The Tabular AI Orchestration service acts as the unified tabular inference
    layer for the AI Core platform, exposing a single prediction endpoint that handles
    request validation, context selection, and Tabular Foundation Model interface
    harmonization automatically. It leverages Tabular Foundation Models to generate
    predictions from structured enterprise data using in-context learning, eliminating
    the need for dataset-specific training. By abstracting the complexity of data
    connectivity and schema interpretation, this service allows developers to seamlessly
    integrate predictive AI capabilities into business processes through a standardized
    invocation interface.
  contact:
    name: SAP AI Core
paths:
  /predict:
    post:
      tags:
        - Predict
      summary: Make predictions using a Tabular Foundation Model
      description: "Make predictions with a supported Tabular Foundation Model using\
        \ rows or columns.\n\n    **TabPFN**\n\n    Select modelName: tabpfn-3.5-plus.\
        \ TabPFN supports exactly one target column per request. Set the target\n\
        \    task_type to classification or regression; the default is classification.\
        \ Supply labelled training rows through\n    contextRows/contextColumns, labelled\
        \ query rows, or context selection. At least one labelled training row and\n\
        \    one query row containing the prediction placeholder are required. Regression\
        \ training targets must be numeric.\n    Classification training targets must\
        \ not be null or empty; entirely numeric targets are rejected by this\n  \
        \  orchestrator's classification preprocessing.\n\n    **Response format**\n\
        \n    responseFormat defaults to native, which returns the model-native response.\
        \ Select harmonized\n    for the common response schema. The legacy spelling\
        \ harmonised is also accepted and normalized to harmonized.\n    For TabPFN,\
        \ native responses contain metadata, prediction, usage, and optionally model_id.\
        \ Harmonized responses\n    contain id, modelName, metadata, predictions,\
        \ and explanations. TabPFN currently returns null for id and\n    explanations\
        \ in harmonized responses.\n\n    **Output types**\n\n    Set modelConfig.task_config.predict_params.output_type.\
        \ Native classification supports probas,\n    preds, and top_k. Harmonized\
        \ classification supports top_k only. Native regression supports mean, median,\
        \ mode,\n    quantiles, full, and main. Harmonized regression supports main,\
        \ mean, median, and mode. When neither the request\n    nor deployment defaults\
        \ supply output_type, native classification defaults to probas and native\
        \ regression to\n    mean; harmonized classification defaults to top_k and\
        \ harmonized regression to main. Omit output_type to use\n    these defaults.\
        \ For harmonized regression, main uses the model's mean and the first and\
        \ last quantile arrays as\n    confidenceInterval (10th and 90th percentiles\
        \ with the model's default quantiles). mean, median, and mode return\n   \
        \ the selected statistic without confidenceInterval. They do not trigger a\
        \ second inference request for intervals.\n\n    **Configuration**\n\n   \
        \ TabPFN configuration is passed under modelConfig.task_config.tabpfn_config\
        \ and\n    modelConfig.task_config.predict_params. Do not send RPT-only options\
        \ such as data_schema, parse_data_types, or\n    context_mode. balance_probabilities\
        \ is classification-only. Set predictionConfig.targetColumns[].top_k for\n\
        \    classification; an explicit modelConfig.task_config.predict_params.top_k\
        \ takes precedence. When neither is set,\n    top_k defaults to 1. modelConfig.index_column\
        \ identifies a column to exclude from model features; it is not\n    forwarded\
        \ to TabPFN.\n\n    **Data format**\n\n    Use either rows with contextRows,\
        \ or columns with contextColumns. Query and supplied context data\n    must\
        \ have the same column names. Target-column keys task_type, prediction_placeholder,\
        \ and top_k also accept the\n    camelCase aliases taskType, predictionPlaceholder,\
        \ and topK. Use contextSelectionConfig.strategy: none when all\n    training\
        \ context is supplied in the request.\n\n    Required header: ai-resource-group.\
        \ Authenticate with OAuth2 through the SAP AI Core deployment endpoint. The\n\
        \    request and response examples use synthetic data and illustrative predictions;\
        \ they are not accuracy guarantees."
      operationId: predict.v1.predict_endpoints.predict
      parameters:
        - name: ai-resource-group
          in: header
          required: true
          schema:
            type: string
            description: AI Core resource group identifier
            title: Ai-Resource-Group
          description: AI Core resource group identifier
